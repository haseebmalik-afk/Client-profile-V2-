<style>
/* ===== Design tokens (spec §1B) ===== */
:root, [data-theme="light"]{
  --bg:#F4F7FC; --surface:#FFFFFF; --raised:#F7F9FD; --surface2:#EEF2FA;
  --ink:#17213D; --ink-soft:#5E6C84; --ink-faint:#8E9EB7;
  --line:#DCE5F2; --line-strong:#C9D5EA;
  --brand:#3867E8; --brand-soft:#E7EDFD; --brand-ink:#2850C8;
  --violet:#6252C8; --violet-soft:#ECE9FA; --violet-ink:#4E3FB0;
  --green:#168362; --green-soft:#E1F3EC; --amber:#B07A17; --amber-soft:#F7EEDD;
  --red:#C74858; --red-soft:#FBE7EA; --neutral:#8E9EB7; --neutral-soft:#EDF0F6;
  --rail:#101A2E; --rail-ink:#C7D2E8; --rail-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(23,33,61,.04), 0 6px 20px rgba(23,33,61,.06);
  --shadow-lift:0 2px 8px rgba(23,33,61,.07), 0 18px 40px rgba(56,103,232,.12);
  --grid:#EBEFF8; --radius:14px;
}
[data-theme="dark"]{
  --bg:#10192B; --surface:#1B2942; --raised:#24344F; --surface2:#1F2E49;
  --ink:#F1F5FF; --ink-soft:#BAC7DF; --ink-faint:#8293B2;
  --line:#384965; --line-strong:#46597A;
  --brand:#89A8FA; --brand-soft:rgba(137,168,250,.16); --brand-ink:#A9C0FB;
  --violet:#B4A5FA; --violet-soft:rgba(180,165,250,.16); --violet-ink:#C7BCFC;
  --green:#67DAB1; --green-soft:rgba(103,218,177,.15); --amber:#EFC172; --amber-soft:rgba(239,193,114,.15);
  --red:#FF8B9B; --red-soft:rgba(255,139,155,.15); --neutral:#8293B2; --neutral-soft:rgba(130,147,178,.15);
  --rail:#0B1422; --rail-ink:#AEBDD8; --rail-line:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --shadow-lift:0 2px 10px rgba(0,0,0,.45), 0 20px 46px rgba(0,0,0,.4);
  --grid:#2A3A58; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-weight:400; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"tnum" 1; transition:background .25s,color .25s;}
.num,.mono{font-variant-numeric:tabular-nums}
a{color:inherit}

/* ===== Shell ===== */
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
.rail{background:var(--rail); color:var(--rail-ink); border-right:1px solid var(--rail-line); padding:20px 14px;
  display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100vh; overflow-y:auto}
.rail .brand{display:block; padding:4px 10px 20px}
.wordmark{display:flex; align-items:flex-start; line-height:1; color:#fff}
.wm-moon{font-family:'Instrument Serif',Georgia,serif; font-size:25px; letter-spacing:.3px; display:inline-flex; align-items:flex-start}
.wm-star{width:9px; height:9px; margin-left:1px; margin-top:2px; color:#89A8FA}
.wm-tech{font-family:Inter; font-weight:500; font-size:14px; margin-left:6px; margin-top:8px; letter-spacing:-.2px}
.brand .sub{font-size:8.5px; letter-spacing:2.4px; text-transform:uppercase; color:rgba(255,255,255,.45); margin-top:7px; padding-left:2px}
.railsec{font-size:9px; letter-spacing:1.6px; text-transform:uppercase; color:rgba(255,255,255,.34); padding:16px 10px 6px}
.navitem{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; color:var(--rail-ink);
  font-size:13.5px; cursor:pointer; transition:.14s; border:none; background:none; width:100%; text-align:left; font-family:inherit}
.navitem:hover{background:rgba(255,255,255,.07); color:#fff}
.navitem.on{background:var(--brand); color:#fff}
[data-theme="light"] .navitem.on{background:var(--brand); color:#fff}
.navitem .ic{width:16px;height:16px;flex:none;opacity:.92}
.main{padding:24px 28px 64px; min-width:0}

/* ===== Header ===== */
.pagehead{display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap; margin-bottom:14px}
.pagehead .tt{margin-right:auto; min-width:0}
.pagehead h1{font-size:22px; font-weight:700; letter-spacing:-.4px; margin:0; color:var(--ink)}
.pagehead .psub{font-size:12.5px; color:var(--ink-soft); margin-top:3px}
.headctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.toggle{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px}
.toggle button{border:none; background:none; font:inherit; font-size:12.5px; color:var(--ink-soft); padding:6px 12px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.toggle button.on{background:var(--brand-soft); color:var(--brand-ink); font-weight:600}
.field{height:34px; border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:0 11px; font:inherit; font-size:12.5px; color:var(--ink); transition:.15s}
.field:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}

/* ===== Filter bar ===== */
.filterbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.seg{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px}
.seg button{border:none; background:none; font:inherit; font-size:12.5px; color:var(--ink-soft); padding:6px 13px; border-radius:7px; cursor:pointer; white-space:nowrap}
.seg button.on{background:var(--brand); color:#fff; font-weight:600}
.btn{height:34px; border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:0 13px; font:inherit; font-size:12.5px; color:var(--ink-soft); cursor:pointer; transition:.15s; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--brand); color:var(--brand-ink)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.grow{margin-left:auto}
.search-wrap{position:relative}
.search-wrap .field{min-width:200px; padding-left:31px}
.search-wrap svg{position:absolute; left:10px; top:9px; width:15px; height:15px; stroke:var(--ink-faint); fill:none}
.typeahead{position:absolute; top:38px; left:0; right:0; background:var(--surface); border:1px solid var(--line-strong); border-radius:11px; box-shadow:var(--shadow-lift); z-index:60; max-height:280px; overflow:auto; display:none}
.typeahead.open{display:block}
.typeahead .item{padding:9px 12px; font-size:12.5px; cursor:pointer; display:flex; justify-content:space-between; gap:10px}
.typeahead .item:hover{background:var(--brand-soft)}
.typeahead .item small{color:var(--ink-faint)}
input[type=file]{display:none}
.custompop{position:absolute; margin-top:6px; background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow-lift); padding:14px; z-index:70; display:none; min-width:230px}
.custompop.open{display:block}
.cprow{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.cprow label{font-size:11px; color:var(--ink-soft); width:38px}

/* ===== Source state + data quality ===== */
.srcbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; padding:9px 14px; border:1px solid var(--line); background:var(--surface); border-radius:11px; font-size:12px; color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:var(--green); box-shadow:0 0 7px var(--green)} .dot.sample{background:var(--amber); box-shadow:0 0 7px var(--amber)}
.dot.err{background:var(--red); box-shadow:0 0 7px var(--red)} .dot.stale{background:var(--neutral)}
.srcbar .sep{color:var(--line-strong)}
.dq{margin-left:auto; cursor:pointer; color:var(--amber); font-weight:600}
.dqpanel{display:none; margin:0 0 14px; border:1px solid var(--amber); background:var(--amber-soft); border-radius:12px; padding:12px 15px; font-size:12.5px; color:var(--ink)}
.dqpanel.open{display:block}
.dqpanel b{font-weight:600} .dqpanel ul{margin:7px 0 0; padding-left:18px} .dqpanel li{margin:3px 0}

/* ===== Cards / KPIs ===== */
.kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:13px; margin-bottom:16px}
.kpi{position:relative; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface); padding:16px 17px; box-shadow:var(--shadow); min-width:0; overflow:hidden; transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.kpi .top{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.kpi .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.kpi .h{font-size:11.5px; color:var(--ink-soft); font-weight:500}
.kpi .v{font-size:27px; font-weight:700; letter-spacing:-.8px; line-height:1; color:var(--ink)}
.kpi .cur{font-size:14px; font-weight:600; color:var(--ink-faint); margin-right:2px}
.kpi .s{font-size:11.5px; color:var(--ink-soft); margin-top:9px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.chip{font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; display:inline-flex; align-items:center; gap:3px}
.chip.up{color:var(--green); background:var(--green-soft)} .chip.down{color:var(--red); background:var(--red-soft)}
.chip.flat{color:var(--ink-soft); background:var(--neutral-soft)}
.kpi.accent-green .ico{background:var(--green-soft);color:var(--green)} .kpi.accent-violet .ico{background:var(--violet-soft);color:var(--violet-ink)}
.kpi.accent-amber .ico{background:var(--amber-soft);color:var(--amber)} .kpi.accent-red .ico{background:var(--red-soft);color:var(--red)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; min-width:0}
.panel h3{font-size:13.5px; letter-spacing:-.1px; color:var(--ink); margin:0 0 3px; font-weight:600; display:flex; align-items:center; gap:7px}
.panel .lede{font-size:12px; color:var(--ink-faint); margin:0 0 15px}
.panel .hl{font-size:12px; color:var(--brand-ink); cursor:default; margin-left:auto; font-weight:500}
.ph-row{display:flex; align-items:flex-start; gap:12px}
.grid2{display:grid; grid-template-columns:1.55fr 1fr; gap:15px; margin-top:15px}
.grid2b{display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px}
.grid3{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:15px; margin-top:15px}
@media(max-width:1250px){ .grid2,.grid2b,.grid3{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(3,1fr)} }
@media(max-width:1050px){ .app{grid-template-columns:1fr} .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible} .railsec{display:none} }
@media(max-width:720px){ .kpis{grid-template-columns:repeat(2,1fr)} .main{padding:16px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

.report{display:none; animation:fade .2s ease}
.report.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ===== Badges / pills ===== */
.pill{font-size:11px; padding:3px 9px; border-radius:20px; display:inline-block; white-space:nowrap; font-weight:600}
.pill.green{background:var(--green-soft); color:var(--green)} .pill.amber{background:var(--amber-soft); color:var(--amber)}
.pill.red{background:var(--red-soft); color:var(--red)} .pill.grey{background:var(--neutral-soft); color:var(--ink-soft)}
.pill.brand{background:var(--brand-soft); color:var(--brand-ink)} .pill.violet{background:var(--violet-soft); color:var(--violet-ink)}
.gate{border:1px dashed var(--line-strong); border-radius:12px; padding:18px; background:var(--raised); color:var(--ink-soft); font-size:12.5px; text-align:center}
.gate b{color:var(--ink)}
.gate .tag{display:inline-block; font-size:10px; letter-spacing:.6px; text-transform:uppercase; font-weight:700; color:var(--amber); background:var(--amber-soft); padding:3px 9px; border-radius:6px; margin-bottom:8px}

/* ===== Tables ===== */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{text-align:left; font-weight:600; color:var(--ink-faint); font-size:10px; letter-spacing:.6px; text-transform:uppercase; padding:9px 9px; border-bottom:1px solid var(--line-strong); white-space:nowrap}
td{padding:9px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--raised)}
.rt{text-align:right}
.tbl-wrap{overflow:auto}
.avatar{width:26px;height:26px;border-radius:8px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;letter-spacing:.3px}
.cflex{display:flex;align-items:center;gap:9px}

/* ===== Charts ===== */
.chart{width:100%; display:block}
.chart text{fill:var(--ink-faint); font-size:10px; font-variant-numeric:tabular-nums}
.chart .bar{transition:.15s} .chart .bar:hover{opacity:.82}
.legend{display:flex; gap:14px; font-size:11px; color:var(--ink-soft); margin-top:8px; flex-wrap:wrap}
.legend i{width:11px;height:3px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend .d{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.tipbox{position:fixed; pointer-events:none; background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); font-size:11.5px; padding:8px 10px; border-radius:9px; opacity:0; transition:opacity .1s; z-index:90; white-space:nowrap; box-shadow:var(--shadow-lift)}
.tipbox b{font-weight:600}

/* ===== Misc blocks ===== */
.statrow{display:grid; gap:12px; margin-bottom:16px}
.ministat{border:1px solid var(--line); border-radius:12px; padding:14px 15px; background:var(--surface); position:relative; overflow:hidden}
.ministat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--brand))}
.ministat .l{font-size:10px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-soft)}
.ministat .v{font-size:23px; font-weight:700; margin-top:7px; color:var(--ink); letter-spacing:-.6px}
.ministat .c{font-size:11px; color:var(--ink-faint); margin-top:5px}
.ministat.click{cursor:pointer;transition:.14s} .ministat.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.ministat.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.slider-row{margin:14px 0}
.slabel{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:7px}
.slabel b{color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);cursor:pointer;box-shadow:0 2px 6px rgba(56,103,232,.4)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);cursor:pointer}
.movetag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.movetag.m1{background:var(--amber-soft);color:var(--amber)} .movetag.m2{background:var(--green-soft);color:var(--green)}
.upliftbox{border:1px solid var(--line); border-radius:12px; background:var(--raised); padding:14px 16px}
.upliftbox .row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:12.5px; color:var(--ink-soft); border-bottom:1px solid var(--line)}
.upliftbox .row:last-child{border-bottom:none}
.upliftbox .row b{color:var(--ink); font-weight:600}
.gapbar{height:7px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.gapbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--violet))}
.recocard{display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--line)}
.recocard:last-child{border-bottom:none}
.reconum{width:24px;height:24px;border-radius:50%;flex:none;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.reco-t{font-size:13px;font-weight:600;color:var(--ink)} .reco-d{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.heat td{text-align:center;font-weight:600}
.phases{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.ph{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--violet)}
.ph.on{background:var(--violet)} .mlabel{font-size:11px;color:var(--ink-soft);margin-left:5px}
.acqlog{max-height:330px;overflow:auto}
.footnote{font-size:11px;color:var(--ink-faint);margin-top:26px;text-align:center;line-height:1.7}
details.client{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
details.client summary{list-style:none;cursor:pointer;padding:12px 15px;display:grid;grid-template-columns:1.7fr .9fr 1fr .9fr .9fr;gap:12px;align-items:center}
details.client summary::-webkit-details-marker{display:none}
details.client summary:hover{background:var(--raised)}
.caret{transition:.2s;color:var(--ink-faint);display:inline-block}
details[open] .caret{transform:rotate(90deg)}
.cmeta{font-size:11px;color:var(--ink-faint)} .cmeta b{font-weight:600;color:var(--ink);font-size:13px}
.cbody{padding:4px 15px 14px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.stepsvg .fan{opacity:.95}
</style>
</head>

    <button class="navitem" data-r="build"><svg class="ic" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6 21V9l6-4 6 4v12"/><path d="M10 21v-6h4v6"/></svg>Brand Build</button>

const F = {

  usd:n=>"$"+Math.round(n||0).toLocaleString("en-US"),
  ccyLbl:()=>(STATE.ccy||"AED")==="USD"?"$":"AED",

  pct:n=>(n>=0?"+":"")+n.toFixed(1)+"%",
  date:d=>d?String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+"/"+d.getFullYear():"—",
  ym:d=>d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"):null,
  ymLabel:k=>{const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleString("en-US",{month:"short"})+" "+y.slice(2)}

const parseDate=v=>{ if(!v)return null; v=String(v).trim(); if(!v||/^n\/?a$/i.test(v))return null;
  let m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/); if(m){let[_,a,b,y]=m;y=y.length===2?"20"+y:y;return new Date(+y,+a-1,+b);}
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(v); return isNaN(d)?null:d; };
const parseAmt=v=>{ if(v==null)return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };
const parseMile=v=>{ const m=String(v||"").match(/milestone[\s\-]*([1-5])/i); return m?+m[1]:null; };
const norm=s=>String(s||"").trim().toLowerCase().replace(/[\s\-]+/g," ");
const HKEYS={
  invoice:["invoice"], client:["client name"], brandCol:["brand name"], desc:["description"], brand:["brand"],
  mile:["roas milestone","roas- milestone","roas-milestone"], invDate:["invoice date"],
  terms:["payment terms"], due:["due date"], pastDue:["days past due"], total:["total"],
  status:["invoice status"], amend:["ammendment details","amendment details"],
  payMethod:["payment method"],
  vat:["vat"], usd:["$ amount","amount $","usd amount","$amount"], refund:["refunds vat exclusive","refunds","refund","refund ($)","refunds ($)","refund $","refunds vat"],
  payDate:["payment receipt date","payment recepit date","payment reciept date"],
  daysToPay:["days between invoicing and payment"], today:["todays date","today's date"]
};
function buildMap(h){ const map={}, H=h.map(norm); for(const k in HKEYS) for(const c of HKEYS[k]){ const i=H.indexOf(norm(c)); if(i>=0){map[k]=h[i];break;} } return map; }
let STATE={ rows:[], today:new Date(), source:"", srcKind:"sample", trkMsg:"", months:[], ledgerFilter:"all", ccy:"AED", dropped:new Set(), manualDropped:new Set(), tracker:[], churnedBrands:new Set(), unmatchedChurn:[], route:"overview", period:"", query:"", dq:[] };

function usdNet(i){ let gross=i.usd||(i.total/CONFIG.AED_PER_USD); if(i.vatInc) gross=gross/(1+CONFIG.VAT_RATE);
  const refund=i.refundUsd||(i.refundAed?i.refundAed/CONFIG.AED_PER_USD:0); return Math.max(0,gross-refund); }
const normBrand=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const tidy=s=>String(s||"").replace(/[‐-―−﹘﹣－]/g,"-").replace(/[   ]/g," ").replace(/\s+/g," ").trim();
const shortName=n=>tidy(n).replace(/\s*(l\.?l\.?c\.?-?fz?|llc|fz llc|fze|trading company|company|general trading|- moontech|- mt)\b/gi,"").replace(/\s*-\s*/g," — ").replace(/\s+/g," ").trim()||tidy(n);
const brandName=n=>{ const t=tidy(n),tl=t.toLowerCase();
  for(const frag in (CONFIG.BRAND_OVERRIDES||{})) if(tl.includes(frag.toLowerCase())) return CONFIG.BRAND_OVERRIDES[frag];
  let parts=t.split(/\s*-\s*/).map(s=>s.trim()).filter(Boolean).filter(p=>!/^(moontech|mt)$/i.test(p));
  let b=parts.length>1?parts[parts.length-1]:(parts[0]||t); b=b.replace(/[\s,]+(MT|Moontech)$/i,"").trim();
  return parts.length>1&&b?b:shortName(parts.join(" - ")||t); };
const shortDesc=d=>d&&d.length>46?d.slice(0,44)+"…":(d||"");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function normalizeRows(raw, headers){
  const map=buildMap(headers), get=(r,k)=> map[k]!==undefined? r[map[k]] : "";
  const rows=raw.map((r,idx)=>{
    const status=String(get(r,"status")||"").trim();
    const client=tidy(get(r,"client")), brandCell=tidy(get(r,"brandCol"));
    const refundRaw=get(r,"refund"); const refundVal=parseAmt(refundRaw);
    const refundIsUsd=/\$/.test(String(refundRaw))||!/aed/i.test(String(refundRaw));
    const usdRaw=get(r,"usd");
    return {
      _row:idx+2, invoice:String(get(r,"invoice")||"").trim(), client,
      brand: brandCell || brandName(client), brandFromSheet:!!brandCell,
      desc:String(get(r,"desc")||"").trim(), isNew:/new brand/i.test(get(r,"brand")||""),
      mile:parseMile(get(r,"mile")), invDate:parseDate(get(r,"invDate")), due:parseDate(get(r,"due")),
      pastDue:parseAmt(get(r,"pastDue")), total:parseAmt(get(r,"total")), usd:parseAmt(usdRaw),
      usdMissing: usdRaw==null||String(usdRaw).trim()==="",
      refundUsd: refundVal&&refundIsUsd?refundVal:0, refundAed: refundVal&&!refundIsUsd?refundVal:0,
      vatInc:/includ/i.test(String(get(r,"vat")||"")),
      terms:String(get(r,"terms")||"").trim(), amend:String(get(r,"amend")||"").trim(), payMethod:String(get(r,"payMethod")||"").trim(),
      daysToPay:parseAmt(get(r,"daysToPay")),
      status, isPaid:/^paid$/i.test(status), isCancelled:/^cancelled$/i.test(status),
      payDate:parseDate(get(r,"payDate")), todayRaw:get(r,"today")
    };
  }).filter(r=> r.client || r.invoice);
  let today=null; for(const r of rows){ const d=parseDate(r.todayRaw); if(d){today=d;break;} }
  if(!today){ for(const h of headers){ const d=parseDate(h); if(d){today=d;break;} } }
  return {rows, today: today||new Date()};
}
function byClient(rows){
  const m=new Map();
  for(const r of rows){ const k=r.brand||r.client; if(!k)continue; if(!m.has(k))m.set(k,[]); m.get(k).push(r); }
  const out=[];
  for(const [name,invs] of m){
    const paid=invs.filter(i=>i.isPaid);
    const paidMiles=paid.map(i=>i.mile).filter(Boolean);
    const anyMiles=invs.map(i=>i.mile).filter(Boolean);
    const level=paidMiles.length?Math.max(...paidMiles):(anyMiles.length?Math.max(...anyMiles):null);
    const totalPaid=paid.reduce((s,i)=>s+i.total,0);
    const outstanding=invs.filter(i=>!i.isPaid&&!i.isCancelled).reduce((s,i)=>s+i.total,0);
    const firstPaid=paid.filter(i=>i.invDate).sort((a,b)=>a.invDate-b.invDate)[0]||null;
    const firstPaidPay=paid.filter(i=>i.payDate).sort((a,b)=>a.payDate-b.payDate)[0]||firstPaid;
    const latestPaid=paid.filter(i=>i.invDate).sort((a,b)=>b.invDate-a.invDate)[0]||null;
    out.push({name,invs,paid,hasPaid:paid.length>0,isNew:invs.some(i=>i.isNew),
      entities:[...new Set(invs.map(i=>i.client).filter(Boolean))],
      level, paidLevel: paidMiles.length?Math.max(...paidMiles):null,
      totalPaid, outstanding, firstPaid, firstPaidPay, latestPaid});
  }
  return out;
}
function computeARPA(clients){
  const inc=(CONFIG.ARPA_INCLUDE_BRANDS||[]).map(s=>s.toLowerCase());
  const isAnom=c=>inc.includes(String(c.name).toLowerCase());
  const rowsWork=[];
  const qualifying=clients.filter(c=> c.hasPaid && (c.paidLevel||isAnom(c)));
  const excluded=clients.filter(c=> c.hasPaid && !c.paidLevel && !isAnom(c)).length;
  for(const c of qualifying){
    const roasPaid=c.paid.filter(i=>i.mile);
    const dropped=STATE.dropped.has(c.name);
    let usd, basis, latest=null;
    const relevant=c.paidLevel?roasPaid:c.paid;
    const refundAmt=relevant.reduce((s,i)=>s+(i.refundUsd||(i.refundAed?i.refundAed/CONFIG.AED_PER_USD:0)),0);
    if(!c.paidLevel){ usd=c.paid.reduce((s,i)=>s+usdNet(i),0); basis="Spend to date (CPL — included)"; }
    else if(c.paidLevel<=2){ usd=roasPaid.reduce((s,i)=>s+usdNet(i),0); basis="ROAS spend to date"; }
    else if(dropped){ const yr=STATE.today.getFullYear();
      const ytd=roasPaid.filter(i=>{ const d=i.payDate||i.invDate; return d&&d.getFullYear()===yr; });
      usd=(ytd.length?ytd:roasPaid).reduce((s,i)=>s+usdNet(i),0); basis="Dropped · YTD spend"; }
    else { latest=roasPaid.filter(i=>i.invDate).sort((a,b)=>b.invDate-a.invDate)[0]||c.latestPaid;
      usd=(latest?usdNet(latest):0)*12; basis="Latest paid × 12"; }
    const churn=(STATE.churnedBrands&&STATE.churnedBrands.has(normBrand(c.name)));
    rowsWork.push({name:c.name, level:c.paidLevel, basis, usd, latest, dropped, canDrop:c.paidLevel>2, refundAmt, churn});
  }
  const arpa=rowsWork.length? rowsWork.reduce((s,r)=>s+r.usd,0)/rowsWork.length : 0;
  return {arpa, n:rowsWork.length, excluded, rows:rowsWork.sort((a,b)=>b.usd-a.usd)};
}
function monthKeysFrom(startISO,endDate){ const s=new Date(startISO), keys=[]; let y=s.getFullYear(),m=s.getMonth();
  const ey=endDate.getFullYear(),em=endDate.getMonth();
  while(y<ey||(y===ey&&m<=em)){ keys.push(y+"-"+String(m+1).padStart(2,"0")); m++; if(m>11){m=0;y++;} } return keys; }
function revenueForMonth(rows,key){ return rows.filter(r=>r.isPaid&&F.ym(r.payDate)===key).reduce((s,r)=>s+r.total,0); }
function newBrandAcquisitions(clients){ const out=[];
  for(const c of clients){ const fp=c.firstPaidPay||c.firstPaid; const d=fp&&(fp.payDate||fp.invDate); if(c.isNew&&d) out.push({name:c.name,month:F.ym(d),date:d}); }
  (CONFIG.REACQUIRED||[]).forEach(x=>{ const nb=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
    const c=clients.find(cl=>nb(cl.name)===nb(x.brand));
    if(c){ const [y,m]=x.month.split("-").map(Number); out.push({name:c.name, month:x.month, date:new Date(y,m-1,15), reacquired:true}); } });
  return out; }
function filteredRows(){ const q=STATE.query; if(!q)return STATE.rows; const ql=q.toLowerCase();
  return STATE.rows.filter(r=> r.brand.toLowerCase().includes(ql)||r.client.toLowerCase().includes(ql)||r.invoice.toLowerCase().startsWith(ql)); }
function resolvePeriod(sel, today){
  if(!sel||sel==="ALL") return {isAll:true, yearSel:null, inSel:()=>true, inPrev:()=>false, label:"Overall", prevLabel:"", end:today};
  let m;
  if((m=/^Y(\d{4})$/.exec(sel))){ const y=+m[1];
    return {isAll:false, yearSel:y, inSel:d=>d&&d.getFullYear()===y, inPrev:d=>d&&d.getFullYear()===y-1, label:String(y), prevLabel:String(y-1), end:new Date(y,11,31)}; }
  if((m=/^Q(\d{4})-([1-4])$/.exec(sel))){ const y=+m[1],q=+m[2], sM=(q-1)*3;
    const inQ=(dy,dm,qy,qq)=>dy===qy&&Math.floor(dm/3)+1===qq; const py=q===1?y-1:y, pq=q===1?4:q-1;
    return {isAll:false, yearSel:null, inSel:d=>d&&inQ(d.getFullYear(),d.getMonth(),y,q), inPrev:d=>d&&inQ(d.getFullYear(),d.getMonth(),py,pq),
      label:`Q${q} ${y}`, prevLabel:`Q${pq} ${py}`, end:new Date(y,sM+3,0)}; }
  if((m=/^C:(\d{4}-\d{2}-\d{2}):(\d{4}-\d{2}-\d{2})$/.exec(sel))){ const s=new Date(m[1]),e=new Date(m[2]); e.setHours(23,59,59);
    const span=e-s; const ps=new Date(s-span-86400000), pe=new Date(s-86400000);
    return {isAll:false, yearSel:null, inSel:d=>d&&d>=s&&d<=e, inPrev:d=>d&&d>=ps&&d<=pe, label:`${F.date(s)}–${F.date(e)}`, prevLabel:"prior range", end:e}; }
  const [y,mm]=sel.split("-").map(Number); const prev=F.ym(new Date(y,mm-2,1));
  return {isAll:false, yearSel:null, inSel:d=>d&&F.ym(d)===sel, inPrev:d=>d&&F.ym(d)===prev, label:F.ymLabel(sel), prevLabel:F.ymLabel(prev), end:new Date(y,mm,0)};
}
/* ---- Tracker ---- */
const TKEYS={ brand:["brand name"], tier:["client tier"], status:["status"], integration:["dashboard integration"], milestone:["current milestone"],
  daysIntegrate:["days for integration"], intDone:["integration completion date"],
  timeCampaign:["days from payment to campaign","days from payment to c"], firstAd:["first ad live date","first ad live","first ad date"],
  churnDate:["churn date"], signMonth:["month of signing"] };
function buildTMap(h){ const map={}, H=h.map(norm); for(const k in TKEYS) for(const c of TKEYS[k]){ const i=H.indexOf(norm(c)); if(i>=0){map[k]=h[i];break;} } return map; }
function parseDaysNum(v){ const m=String(v||"").match(/(-?\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):null; }
function ingestTracker(data, fields){
  const map=buildTMap(fields), get=(r,k)=> map[k]!==undefined? r[map[k]] : "";
  const rows=data.map(r=>({ brand: tidy(get(r,"brand")), tier:String(get(r,"tier")||"").trim(), status:String(get(r,"status")||"").trim(),
    integration:String(get(r,"integration")||"").trim(), milestone:parseDaysNum(get(r,"milestone")),
    daysIntegrate:parseDaysNum(get(r,"daysIntegrate")), timeCampaign:parseDaysNum(get(r,"timeCampaign")),
    firstAd:parseDate(get(r,"firstAd")), churnDate:String(get(r,"churnDate")||"").trim(), signMonth:String(get(r,"signMonth")||"").trim()
  })).filter(r=> r.brand && !/^average$/i.test(r.brand));
  STATE.tracker=rows; STATE.churnedBrands=new Set(rows.filter(r=>/churn/i.test(r.status)).map(r=>normBrand(r.brand))); applyChurnDrops();
}
function applyChurnDrops(){
  const receivableBrands=new Set(STATE.rows.map(r=>normBrand(r.brand)));
  STATE.unmatchedChurn=[...STATE.churnedBrands].filter(nb=> !receivableBrands.has(nb)).map(nb=>(STATE.tracker.find(t=>normBrand(t.brand)===nb)||{}).brand||nb);
  STATE.dropped=new Set([...STATE.manualDropped]);
  STATE.rows.forEach(r=>{ if(STATE.churnedBrands.has(normBrand(r.brand))) STATE.dropped.add(r.brand); });
}
function loadTracker(){ if(!CONFIG.TRACKER_CSV_URL){ STATE.trkMsg="Tracker: not configured"; return; }
  Papa.parse(CONFIG.TRACKER_CSV_URL,{download:true,header:true,skipEmptyLines:true,
    complete:res=>{ if(res.data&&res.data.length){ ingestTracker(res.data,res.meta.fields); STATE.trkMsg="Tracker: live · "+STATE.tracker.length+" brands"; render(); } else { STATE.trkMsg="Tracker: empty"; render(); } },
    error:()=>{ STATE.trkMsg="Tracker: unavailable"; render(); } });
}
/* ---- Brand Build scenario (verbatim) ---- */
let BB_CTX=null, BB_PROMOTE1=0, BB_PROMOTE2=0, BB_FILTER=null;
function bbContext(A){ const T=CONFIG.ARPA_TARGET; const M3VAL=CONFIG.M3_MONTHLY*12; const all=A.rows;
  const baseAvg=all.length?all.reduce((s,r)=>s+r.usd,0)/all.length:0;
  const promotable=all.filter(r=>!r.dropped&&r.level&&r.level<3);
  const m1=promotable.filter(r=>r.level===1); const m2=promotable.filter(r=>r.level===2);
  const active=all.filter(r=>!r.dropped&&r.level); const below=active.filter(r=>r.usd<T);
  return {T,M3VAL,all,baseAvg,active,below,m1,m2, stalledM3:below.filter(r=>r.level>=3),
    m3plusAvg:(()=>{const m=all.filter(r=>!r.dropped&&r.level>=3);return m.length?m.reduce((s,r)=>s+r.usd,0)/m.length:M3VAL;})()}; }
function pools(ctx){ return {m1:ctx.m1.slice().sort((a,b)=>b.usd-a.usd), m2:ctx.m2.slice().sort((a,b)=>b.usd-a.usd)}; }
function projectedARPA(ctx,n1,n2){ const {m1,m2}=pools(ctx); const promote=new Set([...m1.slice(0,n1),...m2.slice(0,n2)].map(r=>r.name));
  const arr=ctx.all.map(r=> promote.has(r.name)? ctx.M3VAL : r.usd); return arr.length? arr.reduce((s,v)=>s+v,0)/arr.length : 0; }
function periodMetrics(sel){ const P=resolvePeriod(sel,STATE.today); const rows=STATE.rows, clients=byClient(rows);
  const acq=newBrandAcquisitions(clients).filter(a=>P.inSel(a.date)).length;
  const rev=rows.filter(r=>r.isPaid&&P.inSel(r.payDate)).reduce((s,r)=>s+r.total,0);
  const asAt=rows.filter(r=>{const d=r.payDate||r.invDate;return !d||d<=P.end;}); const A=computeARPA(byClient(asAt));
  const cashRows=rows.filter(r=>r.isPaid&&P.inSel(r.payDate));
  const avgSpend=acqCohortSpend(clients,P);
  return {label:P.label, acq, rev, arpa:A.arpa, arpaN:A.n, avgSpend, P}; }
function acqCohortSpend(clients,P){ const cohort=clients.filter(c=>{const fp=c.firstPaidPay||c.firstPaid;const d=fp&&(fp.payDate||fp.invDate);return c.isNew&&d&&P.inSel(d);});
  if(!cohort.length)return 0; const cash=cohort.reduce((s,c)=>s+c.paid.filter(i=>P.inSel(i.payDate)).reduce((a,i)=>a+i.total,0),0); return cash/cohort.length; }

// waterfall
function chartWaterfall(el, steps, opt){ opt=opt||{}; const W=760,H=300,pl=58,pr=16,pt=20,pb=52,iw=W-pl-pr,ih=H-pt-pb;
  let cum=0; const vals=[]; let lo=0,hi=0; steps.forEach(s=>{ const start=s.total?0:cum; const end=s.total?s.value:cum+s.value; vals.push({start,end,s}); cum=s.total?s.value:end; lo=Math.min(lo,start,end); hi=Math.max(hi,start,end); });
  const mx=niceMax(hi); const bw=iw/steps.length;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  for(let i=0;i<=4;i++){ const y=pt+ih*i/4; g+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="${cvar('--grid')}"/><text x="${pl-8}" y="${y+3}" text-anchor="end">${(opt.fmt||F.usd)(Math.round(mx*(1-i/4)))}</text>`; }

    g+=`<text x="${x+w/2}" y="${Math.min(y0,y1)-6}" text-anchor="middle" font-weight="600" fill="${cvar('--ink')}">${v.s.total?(opt.fmt||F.usd)(v.s.value):(v.s.value>=0?'+':'')+(opt.fmt||F.usd)(v.s.value)}</text>`;
    const words=String(v.s.label).split(" "); g+=`<text x="${x+w/2}" y="${H-30}" text-anchor="middle">${esc(words.slice(0,2).join(" "))}</text>`;
    if(words.length>2)g+=`<text x="${x+w/2}" y="${H-18}" text-anchor="middle">${esc(words.slice(2).join(" "))}</text>`; });
  g+=`</svg>`; el.innerHTML=g; }

function buildPeriodOptions(){ const sel=document.getElementById("periodSel"); if(!sel)return; const mode=STATE.periodMode||"month";
  const yrs=[...new Set(STATE.rows.flatMap(r=>[r.invDate,r.payDate]).filter(Boolean).map(d=>d.getFullYear()))].sort();
  let opts="";
  if(mode==="all"){ opts=`<option value="ALL">Overall</option>`; }
  else if(mode==="year"){ yrs.forEach(y=>opts+=`<option value="Y${y}">${y}</option>`); }
  else if(mode==="quarter"){ yrs.forEach(y=>{for(let q=1;q<=4;q++){const s=new Date(y,(q-1)*3,1); if(s<=STATE.today)opts+=`<option value="Q${y}-${q}">Q${q} ${y}</option>`;}}); }
  else { monthKeysFrom(CONFIG.ACQUISITION_START,STATE.today).forEach(k=>opts+=`<option value="${k}">${F.ymLabel(k)}</option>`); }
  sel.innerHTML=opts; sel.style.display=mode==="all"?"none":"";
  // default selection
  if(mode==="month"){ const cur=F.ym(STATE.today); sel.value=[...sel.options].some(o=>o.value===cur)?cur:sel.options[sel.options.length-1].value; }
  else if(mode==="year"){ sel.value="Y"+(yrs[yrs.length-1]||STATE.today.getFullYear()); }

}

function buildDQ(){ const dq=[]; const rows=STATE.rows;
  const ids={}; rows.forEach(r=>{ if(r.invoice){ids[r.invoice]=(ids[r.invoice]||0)+1;} });
  const dupes=Object.keys(ids).filter(k=>ids[k]>1); if(dupes.length)dq.push(`${dupes.length} duplicate invoice ID(s): ${dupes.slice(0,5).join(", ")}${dupes.length>5?"…":""}`);
  const noBrand=rows.filter(r=>!r.brand).length; if(noBrand)dq.push(`${noBrand} row(s) with no brand name`);
  const usdFallback=rows.filter(r=>r.usdMissing&&r.mile).length; if(usdFallback)dq.push(`${usdFallback} ROAS invoice(s) with no $ Amount — using Total ÷ ${CONFIG.AED_PER_USD} fallback`);
  if(STATE.unmatchedChurn.length)dq.push(`${STATE.unmatchedChurn.length} churned tracker brand(s) not matched in receivables (not auto-dropped): ${STATE.unmatchedChurn.slice(0,4).join(", ")}`);
  const recvNames=new Set(rows.map(r=>normBrand(r.brand))); const trkUnmatched=STATE.tracker.filter(t=>!recvNames.has(normBrand(t.brand)));
  if(trkUnmatched.length)dq.push(`${trkUnmatched.length} tracker brand(s) with no receivables match`);
  const negAd=STATE.tracker.filter(t=>t.firstAd&&false).length;
  const reacq=(CONFIG.REACQUIRED||[]).length; if(reacq)dq.push(`${reacq} approved re-acquisition(s) counted (JustHype 2026-07)`);
  if(STATE.srcKind!=="live")dq.push(`Source is ${STATE.srcKind.toUpperCase()} — figures are not live`);
  STATE.dq=dq;
  const t=document.getElementById("dqToggle"); if(t){ if(dq.length){ t.style.display=""; t.textContent=`⚠ Data quality (${dq.length})`; } else t.style.display="none"; }
}
function computeContext(){
  const rows=filteredRows(), clients=byClient(rows), today=STATE.today;
  const P=resolvePeriod(STATE.period, today);
  const cashSel=rows.filter(r=>r.isPaid&&P.inSel(r.payDate)), cashPrev=rows.filter(r=>r.isPaid&&P.inPrev(r.payDate));
  const rev=cashSel.reduce((s,r)=>s+r.total,0), revPrev=cashPrev.reduce((s,r)=>s+r.total,0);
  const billSel=rows.filter(r=>P.inSel(r.invDate)), billPrev=rows.filter(r=>P.inPrev(r.invDate));
  const sum=a=>a.reduce((s,r)=>s+r.total,0);
  const invoicedRows=billSel.filter(r=>!r.isCancelled), paidRows=billSel.filter(r=>r.isPaid),
        unpaidRows=billSel.filter(r=>!r.isPaid&&!r.isCancelled), cancRows=billSel.filter(r=>r.isCancelled);
  // open A/R as-of (all history)
  const openAsOf=rows.filter(r=>!r.isPaid&&!r.isCancelled&&(!r.invDate||r.invDate<=P.end));
  const overdue=openAsOf.filter(r=> r.due? r.due<today : (r.pastDue>0));
  const acq=newBrandAcquisitions(clients); const acqSel=acq.filter(a=>P.inSel(a.date)), acqPrev=acq.filter(a=>P.inPrev(a.date));
  const asAtRows=rows.filter(r=>{const d=r.payDate||r.invDate;return !d||d<=P.end;});
  const A=computeARPA(byClient(asAtRows));
  const prevEnd=P.isAll?null:new Date(P.end.getFullYear(),P.end.getMonth()-(P.yearSel?0:1),P.end.getDate());
  const APrev=prevEnd?computeARPA(byClient(rows.filter(r=>{const d=r.payDate||r.invDate;return !d||d<=prevEnd;}))):null;
  const activeBrands=byClient(asAtRows).filter(c=>c.hasPaid&&c.paidLevel&&!STATE.dropped.has(c.name)).length;
  return {rows,clients,today,P,cashSel,rev,revPrev,sum,invoicedRows,paidRows,unpaidRows,cancRows,openAsOf,overdue,acq,acqSel,acqPrev,A,APrev,activeBrands,
    totalInvoiced:sum(invoicedRows),totalPaid:sum(paidRows),totalUnpaid:sum(unpaidRows),totalCanc:sum(cancRows),
    openAR:sum(openAsOf),overdueAR:sum(overdue)};
}

  const newCohort=C.clients.filter(c=>{const fp=c.firstPaidPay||c.firstPaid;const d=fp&&(fp.payDate||fp.invDate);return c.isNew&&d&&P.inSel(d);});
  const firstAmts=newCohort.map(c=>{const fp=c.firstPaidPay||c.firstPaid;return fp?fp.total:0;}).filter(Boolean).sort((a,b)=>a-b);
  const medSpend=firstAmts.length?firstAmts[Math.floor(firstAmts.length/2)]:0;
  const cohortCash=acqCohortSpend(C.clients,P);

function milestoneTiming(clients){ const out=[]; for(let L=1;L<=4;L++){ const diffs=[];
  clients.forEach(c=>{ const a=c.paid.filter(i=>i.mile===L&&i.payDate).sort((x,y)=>x.payDate-y.payDate)[0]; const b=c.paid.filter(i=>i.mile===L+1&&i.payDate).sort((x,y)=>x.payDate-y.payDate)[0];
    if(a&&b&&b.payDate>a.payDate)diffs.push(Math.round((b.payDate-a.payDate)/86400000)); });
  diffs.sort((x,y)=>x-y); out.push({from:L,to:L+1,median:diffs.length?diffs[Math.floor(diffs.length/2)]:null,n:diffs.length}); } return out; }
function brandMonthlyNet(c){ // last two active months net spend
  const paid=c.paid.filter(i=>i.mile&&i.payDate).sort((a,b)=>a.payDate-b.payDate); if(!paid.length)return{cur:0,prev:0,total:0};
  const byM={}; paid.forEach(i=>{const k=F.ym(i.payDate);byM[k]=(byM[k]||0)+usdNet(i);}); const ks=Object.keys(byM).sort();
  const cur=byM[ks[ks.length-1]]||0, prev=byM[ks[ks.length-2]]||0; const total=paid.reduce((s,i)=>s+usdNet(i),0); return {cur,prev,total}; }
function velocityMovers(clients){ const list=clients.filter(c=>c.hasPaid&&c.paidLevel&&!STATE.dropped.has(c.name)).map(c=>{ const m=brandMonthlyNet(c);
  const mom=m.prev?(m.cur-m.prev)/m.prev*100:(m.cur?100:0); const h=healthOf(c); const trk=(STATE.tracker||[]).find(t=>normBrand(t.brand)===normBrand(c.name));
  let reason='active'; if(!m.cur)reason='no recent paid invoice'; else if(mom<0)reason='spend down MoM'; if(trk&&/hold/i.test(trk.status))reason='on hold';
  return {name:c.name,level:c.paidLevel,spend:m.total,mom,health:h.label,hp:h.pill,hc:h.color,reason}; });
  return list.sort((a,b)=>b.mom-a.mom); }
function healthOf(c){ const lvl=c.paidLevel||0; if(STATE.dropped.has(c.name))return{label:'Nurture',pill:'grey',color:cvar('--neutral')};
  if(lvl>=4)return{label:'Excellent',pill:'green',color:cvar('--green')}; if(lvl>=3)return{label:'Good',pill:'brand',color:cvar('--brand')};
  if(lvl>=2)return{label:'Watch',pill:'amber',color:cvar('--amber')}; return{label:'Nurture',pill:'violet',color:cvar('--violet')}; }
function healthClasses(rows){ const cl={Excellent:0,Good:0,Watch:0,Nurture:0}; const col={Excellent:cvar('--green'),Good:cvar('--brand'),Watch:cvar('--amber'),Nurture:cvar('--violet')};
  rows.filter(r=>!r.dropped).forEach(r=>{ const l=r.level||0; cl[l>=4?'Excellent':l>=3?'Good':l>=2?'Watch':'Nurture']++; });
  const tot=Object.values(cl).reduce((a,b)=>a+b,0)||1; const items=Object.keys(cl).map(k=>({label:k,n:cl[k],pct:Math.round(cl[k]/tot*100),color:col[k]}));
  return {items,goodPct:Math.round((cl.Excellent+cl.Good)/tot*100)}; }

function brandCompare(selA,selB){ const PA=resolvePeriod(selA,STATE.today),PB=resolvePeriod(selB,STATE.today);
  const m={}; STATE.rows.filter(r=>r.isPaid).forEach(r=>{ const k=r.brand; m[k]=m[k]||{a:0,b:0}; if(PA.inSel(r.payDate))m[k].a+=r.total; if(PB.inSel(r.payDate))m[k].b+=r.total; });
  const arr=Object.keys(m).map(k=>({name:k,a:m[k].a,b:m[k].b,d:m[k].b-m[k].a})).filter(x=>x.a||x.b).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  const totalDelta=arr.reduce((s,x)=>s+x.d,0);
  const rows=arr.slice(0,40).map(x=>{ const st=x.a&&x.b?'Continuing':x.b?'Added':'Removed'; const sp=st==='Added'?'green':st==='Removed'?'red':'grey'; const pct=x.a?(x.d/x.a*100):null;
    return `<tr><td>${esc(x.name)}</td><td class="rt mono">${F.aed(x.a)}</td><td class="rt mono">${F.aed(x.b)}</td><td class="rt mono" style="color:${x.d>=0?'var(--green)':'var(--red)'}">${x.d>=0?'+':''}${F.aed(x.d)}</td><td class="rt">${pct==null?'New':F.pct(pct)}</td><td><span class="pill ${sp}">${st}</span></td></tr>`; }).join("");
  return {rows:rows||'<tr><td class="hint">No paid cash in either period.</td></tr>',totalDelta}; }
function revenueBridge(selA,selB,revA,revB){ const PA=resolvePeriod(selA,STATE.today),PB=resolvePeriod(selB,STATE.today);
  const m={}; STATE.rows.filter(r=>r.isPaid).forEach(r=>{ const k=r.brand; m[k]=m[k]||{a:0,b:0}; if(PA.inSel(r.payDate))m[k].a+=r.total; if(PB.inSel(r.payDate))m[k].b+=r.total; });
  let gained=0,lost=0; Object.values(m).forEach(v=>{ const d=v.b-v.a; if(d>=0)gained+=d; else lost+=d; });
  return [{label:'Period A',total:true,value:revA},{label:'Increases & new',value:gained},{label:'Decreases & lost',value:lost},{label:'Period B',total:true,value:revB}]; }

function firstAdJoin(clients){ let live=0,waiting=0; const liveDays=[];
  STATE.tracker.forEach(t=>{ const c=clients.find(cl=>normBrand(cl.name)===normBrand(t.brand)); const m1=c&&c.paid.filter(i=>i.mile===1&&i.payDate).sort((a,b)=>a.payDate-b.payDate)[0];
    if(t.firstAd&&m1){ live++; liveDays.push(Math.round((t.firstAd-m1.payDate)/86400000)); } else if(m1&&!t.firstAd){ waiting++; } });
  const valid=liveDays.filter(d=>d>=0); return {live,waiting,avgLive:valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):null}; }
function integrationIssues(C,fa){ const t=STATE.tracker; const recv=new Set(STATE.rows.map(r=>normBrand(r.brand)));
  return [
    {label:'Unmatched tracker brand',count:t.filter(r=>!recv.has(normBrand(r.brand))).length,color:cvar('--red')},
    {label:'Integration not completed',count:t.filter(r=>!/complet/i.test(r.integration)).length,color:cvar('--amber')},
    {label:'On hold',count:t.filter(r=>/hold/i.test(r.status)).length,color:cvar('--amber')},
    {label:'Paid M1 but no first ad yet',count:fa.waiting,color:cvar('--amber')},
    {label:'Negative/invalid integration days',count:t.filter(r=>r.daysIntegrate!=null&&r.daysIntegrate<0).length,color:cvar('--red')},
    {label:'Churned',count:t.filter(r=>/churn/i.test(r.status)).length,color:cvar('--neutral')}
  ]; }
function integrationTable(C){ return STATE.tracker.map(t=>{ const c=C.clients.find(cl=>normBrand(cl.name)===normBrand(t.brand));
  const m1=c&&c.paid.filter(i=>i.mile===1&&i.payDate).sort((a,b)=>a.payDate-b.payDate)[0]; const paidM=c?c.paidLevel:null;
  const pay2ad=(t.firstAd&&m1)?Math.round((t.firstAd-m1.payDate)/86400000):null; const matched=!!c;
  const stp=/churn/i.test(t.status)?'red':/active/i.test(t.status)?'green':/hold/i.test(t.status)?'amber':'grey';
  const intp=/complet/i.test(t.integration)?'green':/process|progress/i.test(t.integration)?'amber':'grey';
  return `<tr><td class="cflex"><span class="avatar" style="background:${avatarColor(t.brand)}">${esc(initials(t.brand))}</span>${esc(t.brand)}</td><td>${esc(t.tier||'—')}</td><td><span class="pill ${stp}">${esc(t.status||'—')}</span></td><td><span class="pill ${intp}">${esc(t.integration||'—')}</span></td><td class="rt mono">${t.daysIntegrate!=null?t.daysIntegrate:'—'}</td><td class="mono">${t.firstAd?F.date(t.firstAd):'<span class="hint">—</span>'}</td><td class="rt mono">${pay2ad!=null?pay2ad+'d':'—'}</td><td>${t.milestone?'M'+t.milestone:'—'}</td><td>${paidM?'M'+paidM:'<span class="hint">—</span>'}</td><td style="text-align:center"><span class="d" style="width:11px;height:11px;background:${matched?'var(--green)':'var(--red)'}"></span></td></tr>`; }).join(""); }
